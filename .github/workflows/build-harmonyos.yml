name: Build HarmonyOS HAP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install hvigor build tools
        run: |
          npm install -g @ohos/hvigor @ohos/hvigor-ohos-plugin

      - name: Setup HarmonyOS SDK
        run: |
          # 设置 HarmonyOS SDK 环境变量
          # 注: 如需完整 CI 构建, 需配置 HarmonyOS SDK 路径
          # 可通过 self-hosted runner 或 SDK 缓存实现
          echo "HOS_SDK_HOME=/opt/harmonyos-sdk" >> $GITHUB_ENV
          echo "OHOS_SDK_HOME=/opt/harmonyos-sdk" >> $GITHUB_ENV

      - name: Install ohpm dependencies
        working-directory: harmonyos
        run: |
          # ohpm install (如不可用则跳过, hvigor 会自动处理)
          which ohpm && ohpm install || echo "ohpm not available, skipping"

      - name: Build HAP
        working-directory: harmonyos
        run: |
          node hvigor/hvigor-wrapper.js assembleHap
        continue-on-error: true

      - name: Upload HAP (if built)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: liezhi-harmonyos.hap
          path: harmonyos/entry/build/default/outputs/default/*.hap
